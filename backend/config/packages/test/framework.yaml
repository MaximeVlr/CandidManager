framework:
  test: true
  mailer:
    dsn: 'null://null'
  messenger:
    transports:
      async:
        dsn: 'doctrine://default?auto_setup=0'
        options:
          use_notify: false
        retry_strategy:
          delay: 0
          jitter: 0
      failed:
        dsn: 'doctrine://default?queue_name=failed&auto_setup=0'
        options:
          use_notify: false
