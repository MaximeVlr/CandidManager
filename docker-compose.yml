services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./backend/public:/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  backend:
    build:
      context: ./docker/php
    working_dir: /app
    command: sh -c "test -d vendor || composer install; php-fpm"
    volumes:
      - ./backend:/app
    environment:
      APP_ENV: dev
      APP_SECRET: change-me-in-local-env
      DATABASE_URL: postgresql://app:app@postgres:5432/app?serverVersion=16&charset=utf8
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
      MAILER_DSN: ${MAILER_DSN:-brevo+smtp://USERNAME:PASSWORD@default}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-CandidManager}
      MAIL_SEND_ENABLED: ${MAIL_SEND_ENABLED:-false}
      MAIL_MAX_BATCH_SIZE: ${MAIL_MAX_BATCH_SIZE:-20}
      MAIL_DRY_RUN: ${MAIL_DRY_RUN:-true}
    depends_on:
      postgres:
        condition: service_healthy

  messenger-worker:
    build:
      context: ./docker/php
    working_dir: /app
    command: sh -c "test -d vendor || composer install; php bin/console messenger:consume async --time-limit=3600 --memory-limit=128M --sleep=2 -vv"
    volumes:
      - ./backend:/app
    environment:
      APP_ENV: dev
      APP_SECRET: change-me-in-local-env
      DATABASE_URL: postgresql://app:app@postgres:5432/app?serverVersion=16&charset=utf8
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
      MAILER_DSN: ${MAILER_DSN:-brevo+smtp://USERNAME:PASSWORD@default}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-CandidManager}
      MAIL_SEND_ENABLED: ${MAIL_SEND_ENABLED:-false}
      MAIL_MAX_BATCH_SIZE: ${MAIL_MAX_BATCH_SIZE:-20}
      MAIL_DRY_RUN: ${MAIL_DRY_RUN:-true}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    depends_on:
      - nginx

volumes:
  postgres_data:
